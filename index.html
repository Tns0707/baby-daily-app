
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<title>宝宝成长日记</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
根{
  --pink:#FF6B9D;--pink-light:#FFC2D9;--purple:#A855F7;--purple-light:#E9D5FF;
  --teal:#14B8A6;--teal-light:#99F6E4;--yellow:#FBBF24;--green:#22C55E;
  --orange:#F97316;--blue:#3B82F6;--bg:#FAF5FF;--card:#fff;
  --text:#1F2937;--text-2:#6B7280;--text-3:#9CA3AF;
  --border:#F3F4F6;--radius:16px;--shadow:0 2px 12px rgba(168,85,247,.08);



  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  背景：var(--bg);颜色：var(--text);字体大小：15px;行高：1.5;
  display:flex;justify-content:center;


  宽度:100%;最大宽度:480px;高度:100vh;高度:100dvh;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
  背景:var(--bg);
}

/* ===== 顶部状态栏 ===== */
.状态栏{
  高度:44px;显示:flex;对齐项:center;对齐内容:space-between;
  内边距:0 16px;字体大小:12px;颜色:var(--text-2);
  背景：透明；flex-shrink：0；


}


  定位：绝对；内边距：0；垂直溢出：自动；-webkit-滚动：触摸；
  padding-bottom:80px;opacity:0;pointer-events:none;
  过渡：opacity 0.25秒 ease；滚动条宽度：none；




/* ===== 底部导航 ===== */

  位置：绝对；底部：0；左侧：0；右侧：0；高度：70px；
  背景：rgba(255,255,255,.92)；背景模糊：20px
  -webkit-backdrop-filter:blur(20px);
  上边框：1px 实线 var(--border);显示：flex;
  z-index:100;max-width:480px;margin:0 auto;


  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  间距:3px;光标:指针;过渡:所有 0.2秒;颜色:变量(--text-3);







/* ===== 通用组件 ===== */




/* ===== 首页 ===== */
.hero-panda{position:absolute;right:18px;top:18px;width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4);z-index:2}
.hero{
  margin:0 16px 16px;border-radius:20px;padding:24px 20px;
  background:linear-gradient(135deg,#FF6B9D 0%,#A855F7 100%);
  color:#fff;position:relative;overflow:hidden;
}
.hero::after{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;
  background:rgba(255,255,255,.1);border-radius:50%}
.hero::before{content:'';position:absolute;right:20px;bottom:-40px;width:80px;height:80px;
  background:rgba(255,255,255,.08);border-radius:50%}
.hero-greeting{font-size:14px;opacity:.9;margin-bottom:4px}
.hero-name{font-size:26px;font-weight:800;margin-bottom:2px}
.hero-date{font-size:13px;opacity:.85}
.hero-progress{margin-top:16px;display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.progress-ring{width:56px;height:56px;position:relative;flex-shrink:0}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring .bg-circle{fill:none;stroke:rgba(255,255,255,.25);stroke-width:5}
.progress-ring .fg-circle{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;
  transition:stroke-dashoffset .6s ease}
.progress-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700}
.progress-info{flex:1}
.progress-info .label{font-size:13px;opacity:.9}
.progress-info .nums{font-size:22px;font-weight:800}
.progress-info .nums small{font-size:14px;font-weight:400;opacity:.8}

.quick-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 16px 16px}
.qstat{text-align:center;background:#fff;border-radius:14px;padding:14px 6px;box-shadow:var(--shadow)}
.qstat .icon{font-size:24px;margin-bottom:4px}
.qstat .num{font-size:18px;font-weight:700;color:var(--text)}
.qstat .label{font-size:11px;color:var(--text-3);margin-top:2px}

.domain-cards{padding:0 16px}
.domain-card{
  background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;cursor:pointer;
  transition:transform .15s;
}
.domain-card:active{transform:scale(.97)}
.domain-card .dc-icon{
  width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;
}
.domain-card .dc-info{flex:1;min-width:0}
.domain-card .dc-name{font-size:15px;font-weight:600;margin-bottom:3px}
.domain-card .dc-desc{font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.domain-card .dc-bar{height:5px;border-radius:3px;background:var(--border);margin-top:6px;overflow:hidden}
.domain-card .dc-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.domain-card .dc-arrow{color:var(--text-3);font-size:18px;flex-shrink:0}

.tip-banner{
  margin:16px;background:linear-gradient(135deg,#FEF3C7,#FCE7F3);
  border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;
  border:1px dashed #FBBF24;
}
.tip-banner .tb-icon{font-size:20px;flex-shrink:0}
.tip-banner .tb-text{font-size:13px;color:#92400E;line-height:1.5}

/* ===== 任务页 ===== */
.task-header{
  padding:16px;position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,var(--bg) 80%,transparent);
  padding-bottom:8px;
}
.date-selector{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.date-selector .arrow{width:36px;height:36px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;font-size:18px}
.date-selector .arrow:active{transform:scale(.9)}
.date-selector .date-text{text-align:center}
.date-selector .date-text .day{font-size:18px;font-weight:700}
.date-selector .date-text .week{font-size:12px;color:var(--text-3)}

.domain-filter{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.domain-filter::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;
  white-space:nowrap;cursor:pointer;transition:all .2s;background:#fff;color:var(--text-2);
  box-shadow:var(--shadow);border:1px solid transparent}
.chip.active{color:#fff;border-color:transparent}
.chip[data-domain="all"].active{background:var(--pink)}
.chip[data-domain="sport"].active{background:#FF6B6B}
.chip[data-domain="learn"].active{background:var(--teal)}
.chip[data-domain="think"].active{background:var(--yellow);color:#78350F}
.chip[data-domain="social"].active{background:var(--purple)}
.chip[data-domain="height"].active{background:var(--green)}
.chip[data-domain="self"].active{background:var(--orange)}

.timeline{padding:0 16px}
.tl-item{display:flex;gap:12px;margin-bottom:4px}
.tl-time{width:52px;flex-shrink:0;text-align:right;padding-top:14px}
.tl-time .t{font-size:13px;font-weight:700;color:var(--text-2)}
.tl-line{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.tl-dot{width:12px;height:12px;border-radius:50%;margin-top:18px;border:2px solid #fff;box-shadow:0 0 0 2px var(--border);z-index:1;flex-shrink:0}
.tl-dot.done{background:var(--green)!important;box-shadow:0 0 0 2px var(--green)}
.tl-vline{width:2px;flex:1;min-height:20px;background:var(--border)}
.tl-vline.last{display:none}
.tl-card{
  flex:1;background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;
  box-shadow:var(--shadow);border-left:3px solid var(--border);transition:all .2s;
}
.tl-card.done{opacity:.6}
.tl-card.done .tl-title{text-decoration:line-through;color:var(--text-3)}
.tl-card .tl-title{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.tl-card .tl-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.tl-card .tl-tag{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;color:#fff}
.tl-card .tl-tasks{list-style:none}
.tl-card .tl-tasks li{font-size:13px;color:var(--text-2);padding:3px 0 3px 22px;position:relative;line-height:1.6}
.tl-card .tl-tasks li::before{content:'·';position:absolute;left:8px;font-weight:700;color:var(--text-3)}
.tl-card .tl-tasks li strong{color:var(--text)}
.tl-check{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .2s;flex-shrink:0;margin-left:auto;
}
.tl-check:active{transform:scale(.85)}
.tl-check.done{background:var(--green);border-color:var(--green)}
.tl-check.done svg{opacity:1}
.tl-check svg{width:14px;height:14px;color:#fff;opacity:0;transition:opacity .2s}
.tl-card .tl-header{display:flex;align-items:flex-start;gap:8px}

/* 科学依据弹窗 */
.science-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  display:none;align-items:flex-end;justify-content:center;
}
.science-modal.show{display:flex}
.science-modal .sm-content{
  background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;
  padding:24px 20px 40px;max-height:70vh;overflow-y:auto;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sm-content h3{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sm-content .sm-body{font-size:14px;color:var(--text-2);line-height:1.7;margin-bottom:16px}
.sm-content .sm-note{background:#EFF6FF;border-radius:12px;padding:14px;font-size:13px;line-height:1.6;border-left:3px solid var(--blue)}
.sm-content .sm-note .label{font-weight:700;color:var(--blue);margin-bottom:4px;display:block}
.sm-close{width:100%;padding:14px;border-radius:14px;background:var(--pink);color:#fff;
  font-size:16px;font-weight:600;border:none;cursor:pointer;margin-top:20px}

/* ===== 统计页 ===== */
.stats-overview{padding:0 16px}
.stat-ring-card{
  background:linear-gradient(135deg,#A855F7,#FF6B9D);border-radius:20px;
  padding:24px;text-align:center;color:#fff;margin-bottom:16px;box-shadow:0 4px 20px rgba(168,85,247,.2);
}
.stat-ring-card .big-ring{width:100px;height:100px;margin:0 auto 12px;position:relative}
.stat-ring-card .big-ring svg{transform:rotate(-90deg)}
.stat-ring-card .big-ring .bg-c{fill:none;stroke:rgba(255,255,255,.2);stroke-width:8}
.stat-ring-card .big-ring .fg-c{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.stat-ring-card .big-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.stat-ring-card .label{font-size:14px;opacity:.9}
.stat-ring-card .sub{font-size:12px;opacity:.7;margin-top:4px}

.domain-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:16px}
.ds-card{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.ds-card .ds-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ds-card .ds-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
.ds-card .ds-name{font-size:13px;font-weight:600}
.ds-card .ds-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-bottom:6px}
.ds-card .ds-bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
.ds-card .ds-num{font-size:12px;color:var(--text-3)}
.ds-card .ds-num strong{color:var(--text);font-size:16px}

.week-chart{padding:0 16px;margin-bottom:16px}
.week-chart .wc-card{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.week-chart .wc-title{font-size:14px;font-weight:600;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:120px;gap:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:28px;border-radius:6px 6px 0 0;min-height:4px;transition:height .5s ease}
.bar-col .day-label{font-size:10px;color:var(--text-3)}
.bar-col .day-label.today{color:var(--pink);font-weight:700}

.badges{padding:0 16px}
.badges .b-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{text-align:center}
.badge .b-circle{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 4px;transition:all .2s}
.badge.locked .b-circle{background:var(--border);filter:grayscale(1);opacity:.4}
.badge.unlocked .b-circle{background:linear-gradient(135deg,#FEF3C7,#FBBF24);box-shadow:0 2px 8px rgba(251,191,36,.3)}
.badge .b-name{font-size:10px;color:var(--text-3)}
.badge.unlocked .b-name{color:var(--text);font-weight:600}

/* ===== 个人中心 ===== */
.profile-header{
  background:linear-gradient(135deg,#FF6B9D,#A855F7);padding:30px 20px;
  text-align:center;color:#fff;border-radius:0 0 24px 24px;margin-bottom:16px;
}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 10px;
  border:3px solid rgba(255,255,255,.3);overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:22px;font-weight:800}
.profile-info{font-size:13px;opacity:.85;margin-top:4px}

.profile-stats{display:flex;justify-content:space-around;margin:-8px 16px 16px;background:#fff;
  border-radius:16px;padding:16px;box-shadow:var(--shadow);position:relative;z-index:1}
.ps-item{text-align:center}
.ps-item .num{font-size:22px;font-weight:700;color:var(--pink)}
.ps-item .label{font-size:11px;color:var(--text-3);margin-top:2px}

.menu-list{padding:0 16px}
.menu-item{background:#fff;border-radius:14px;margin-bottom:10px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.menu-item:active{transform:scale(.97)}
.menu-item .mi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.menu-item .mi-text{flex:1;font-size:14px;font-weight:500}
.menu-item .mi-arrow{color:var(--text-3)}

/* ===== Toast ===== */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.75);color:#fff;padding:10px 24px;border-radius:24px;
  font-size:13px;z-index:300;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-8px)}

/* ===== 空状态 ===== */
.empty{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty .emoji{font-size:48px;margin-bottom:12px}
.empty .text{font-size:14px}

/* ===== 动画 ===== */
@keyframes pop{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
</style>
</head>
<body>
<div id="app">
  <div class="status-bar">
    <span id="clock">9:41</span>
    <span style="display:flex;gap:6px;align-items:center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M1 9h2v2H1zm4-2h2v4H5zm4-2h2v6H9zm4-2h2v8h-2z"/></svg>
      <svg width="22" height="12" viewBox="0 0 22 12" fill="none" stroke="currentColor"><rect x="1" y="1" width="18" height="10" rx="2"/><rect x="3" y="3" width="14" height="6" rx="1" fill="currentColor"/><rect x="20" y="4" width="1.5" height="4" rx=".5" fill="currentColor"/></svg>
    </span>
  </div>

  <div class="pages">
    <!-- ========== 首页 ========== -->
    <div class="page active" id="page-home">
      <div class="hero">
        <img src="generated-images/A_super_cute_baby_panda_mascot_2026-07-31T05-46-18.png" alt="熊猫" class="hero-panda">
        <div class="hero-greeting" id="greeting">早上好 👋</div>
        <div class="hero-name">小泡芙的成长日记</div>
        <div class="hero-date" id="todayDate">今天是美好的一天</div>
        <div class="hero-progress">
          <div class="progress-ring">
            <svg width="56" height="56">
              <circle class="bg-circle" cx="28" cy="28" r="24"/>
              <circle class="fg-circle" cx="28" cy="28" r="24" id="homeRing" stroke-dasharray="150.8" stroke-dashoffset="150.8"/>
            </svg>
            <div class="pct" id="homeRingPct">0%</div>
          </div>
          <div class="progress-info">
            <div class="label">今日任务完成</div>
            <div class="nums"><span id="homeDone">0</span><small> / 12</small></div>
          </div>
        </div>
      </div>

      <div class="quick-stats" id="quickStats"></div>

      <div class="section-title">🌱 六大发展领域</div>
      <div class="domain-cards" id="domainCards"></div>

      <div class="tip-banner" id="dailyTip">
        <div class="tb-icon">💡</div>
        <div class="tb-text" id="tipText">加载中...</div>
      </div>
    </div>

    <!-- ========== 任务页 ========== -->
    <div class="page" id="page-task">
      <div class="task-header">
        <div class="date-selector">
          <div class="arrow" onclick="changeDate(-1)">‹</div>
          <div class="date-text">
            <div class="day" id="dateDay">7月31日</div>
            <div class="week" id="dateWeek">星期五 · 今天</div>
          </div>
          <div class="arrow" onclick="changeDate(1)">›</div>
        </div>
        <div class="domain-filter" id="domainFilter">
          <div class="chip active" data-domain="all" onclick="filterDomain(this,'all')">全部</div>
          <div class="chip" data-domain="sport" onclick="filterDomain(this,'sport')">🏃 运动</div>
          <div class="chip" data-domain="learn" onclick="filterDomain(this,'learn')">📚 学习</div>
          <div class="chip" data-domain="think" onclick="filterDomain(this,'think')">🧠 思维</div>
          <div class="chip" data-domain="social" onclick="filterDomain(this,'social')">🤝 社交</div>
          <div class="chip" data-domain="height" onclick="filterDomain(this,'height')">📏 长高</div>
          <div class="chip" data-domain="self" onclick="filterDomain(this,'self')">👕 自理</div>
        </div>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>

    <!-- ========== 统计页 ========== -->
    <div class="page" id="page-stats">
      <div class="section-title">📊 本周完成情况</div>
      <div class="stats-overview">
        <div class="stat-ring-card">
          <div class="big-ring">
            <svg width="100" height="100">
              <circle class="bg-c" cx="50" cy="50" r="42"/>
              <circle class="fg-c" cx="50" cy="50" r="42" id="weekRing" stroke-dasharray="263.9" stroke-dashoffset="263.9"/>
            </svg>
            <div class="pct" id="weekRingPct">0%</div>
          </div>
          <div class="label">本周总完成率</div>
          <div class="sub" id="weekSub">坚持就是胜利！</div>
        </div>
      </div>

      <div class="section-title">🎯 领域完成率</div>
      <div class="domain-stats" id="domainStats"></div>

      <div class="section-title">📅 近7天趋势</div>
      <div class="week-chart">
        <div class="wc-card">
          <div class="wc-title">每日任务完成数</div>
          <div class="bars" id="weekBars"></div>
        </div>
      </div>

      <div class="section-title">🏆 成就徽章</div>
      <div class="badges">
        <div class="b-grid" id="badgesGrid"></div>
      </div>
    </div>

    <!-- ========== 个人中心 ========== -->
    <div class="page" id="page-profile">
      <div class="profile-header">
        <div class="profile-avatar"><img src="generated-images/A_super_cute_baby_panda_mascot_2026-07-31T05-46-18.png" alt="小泡芙熊猫头像"></div>
        <div class="profile-name">小泡芙</div>
        <div class="profile-info">女宝宝 · 2岁1个月</div>

// ========== 状态管理 ==========
let state = {
  currentDate: getToday(),
  filterDomain: 'all',
  data: loadData(),
};

function getToday(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function loadData(){
  try {
    const raw = localStorage.getItem('babyTasksData');
    if(raw) return JSON.parse(raw);
  } catch(e){}
  return { dates:{}, streak:0, totalDone:0, firstUse:getToday() };
}

function saveData(){
  localStorage.setItem('babyTasksData', JSON.stringify(state.data));
}

function getDayData(date){
  if(!state.data.dates[date]){
    state.data.dates[date] = { tasks: new Array(TASKS.length).fill(false) };
  }
  return state.data.dates[date];
}

function getDoneCount(date){
  const d = getDayData(date);
  return d.tasks.filter(t=>t).length;
}

// ========== 页面切换 ==========
function switchPage(name, el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(name==='home') renderHome();
  if(name==='task') renderTimeline();
  if(name==='stats') renderStats();
  if(name==='profile') renderProfile();
}

// ========== 首页渲染 ==========
function renderHome(){
  const done = getDoneCount(state.currentDate);
  const total = TASKS.length;
  const pct = Math.round(done/total*100);
  const circumference = 2*Math.PI*24;
  document.getElementById('homeRing').setAttribute('stroke-dasharray', circumference);
  document.getElementById('homeRing').setAttribute('stroke-dashoffset', circumference*(1-pct/100));
  document.getElementById('homeRingPct').textContent = pct+'%';
  document.getElementById('homeDone').textContent = done;

  // greeting
  const h = new Date().getHours();
  let greet = '早上好 👋';
  if(h>=11&&h<14) greet='中午好 ☀️';
  else if(h>=14&&h<18) greet='下午好 🌤️';
  else if(h>=18) greet='晚上好 🌙';
  document.getElementById('greeting').textContent = greet;

  // date
  const d = new Date();
  const weeks=['日','一','二','三','四','五','六'];
  document.getElementById('todayDate').textContent = `${d.getMonth()+1}月${d.getDate()}日 · 星期${weeks[d.getDay()]}`;

  // quick stats
  const dayData = getDayData(state.currentDate);
  const sportDone = TASKS.filter((t,i)=>t.domains.includes('sport')&&dayData.tasks[i]).length;
  const sportTotal = TASKS.filter(t=>t.domains.includes('sport')).length;
  const learnDone = TASKS.filter((t,i)=>t.domains.includes('learn')&&dayData.tasks[i]).length;
  const learnTotal = TASKS.filter(t=>t.domains.includes('learn')).length;
  const heightDone = TASKS.filter((t,i)=>t.domains.includes('height')&&dayData.tasks[i]).length;
  const heightTotal = TASKS.filter(t=>t.domains.includes('height')).length;

  document.getElementById('quickStats').innerHTML = [
    {icon:'🏃',num:sportDone+'/'+sportTotal,label:'运动'},
    {icon:'📚',num:learnDone+'/'+learnTotal,label:'学习'},
    {icon:'📏',num:heightDone+'/'+heightTotal,label:'长高'},
    {icon:'✅',num:done+'/'+total,label:'完成'},
  ].map(s=>`<div class="qstat"><div class="icon">${s.icon}</div><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`).join('');

  // domain cards
  document.getElementById('domainCards').innerHTML = Object.entries(DOMAINS).map(([key,d])=>{
    const done = TASKS.filter((t,i)=>t.domains.includes(key)&&dayData.tasks[i]).length;
    const total = TASKS.filter(t=>t.domains.includes(key)).length;
    const pct = Math.round(done/total*100);
    return `<div class="domain-card" onclick="switchPage('task',document.querySelector('.tab[data-page=task]'))">
      <div class="dc-icon" style="background:${d.bg}">${d.icon}</div>
      <div class="dc-info">
        <div class="dc-name">${d.name}</div>
        <div class="dc-desc">${d.desc}</div>
        <div class="dc-bar"><div class="dc-bar-fill" style="width:${pct}%;background:${d.color}"></div></div>
      </div>
      <div class="dc-arrow">›</div>
    </div>`;
  }).join('');

  // tip
  const tipIdx = new Date().getDate() % TIPS.length;
  document.getElementById('tipText').textContent = TIPS[tipIdx];
}

// ========== 任务页渲染 ==========
function renderTimeline(){
  const d = new Date(state.currentDate);
  const today = getToday();
  const isToday = state.currentDate === today;
  const weeks=['日','一','二','三','四','五','六'];
  document.getElementById('dateDay').textContent = `${d.getMonth()+1}月${d.getDate()}日`;
  document.getElementById('dateWeek').textContent = `星期${weeks[d.getDay()]}` + (isToday?' · 今天':'');

  const dayData = getDayData(state.currentDate);
  const filtered = state.filterDomain==='all'
    ? TASKS.map((t,i)=>({task:t,index:i}))
    : TASKS.map((t,i)=>({task:t,index:i})).filter(x=>x.task.domains.includes(state.filterDomain));

  if(filtered.length===0){
    document.getElementById('timeline').innerHTML = `<div class="empty"><div class="emoji">🔍</div><div class="text">该领域今日暂无任务</div></div>`;
    return;
  }

  document.getElementById('timeline').innerHTML = filtered.map((item,idx)=>{
    const {task,index} = item;
    const isDone = dayData.tasks[index];
    const dotColor = task.domains[0] ? DOMAINS[task.domains[0]].color : '#ccc';
    return `<div class="tl-item">
      <div class="tl-time"><div class="t">${task.time}</div></div>
      <div class="tl-line">
        <div class="tl-dot ${isDone?'done':''}" style="${isDone?'':`background:${dotColor}`}"></div>
        <div class="tl-vline ${idx===filtered.length-1?'last':''}"></div>
      </div>
      <div class="tl-card ${isDone?'done':''}" style="border-left-color:${dotColor}">
        <div class="tl-header">
          <div style="flex:1">
            <div class="tl-title">${task.title}</div>
            <div class="tl-tags">${task.domains.map(d=>`<span class="tl-tag" style="background:${DOMAINS[d].color}">${DOMAINS[d].icon} ${DOMAINS[d].name}</span>`).join('')}</div>
          </div>
          <div class="tl-check ${isDone?'done':''}" onclick="toggleTask(${index})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <ul class="tl-tasks">${task.tasks.map(t=>`<li>${t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}</li>`).join('')}</ul>
        <div style="margin-top:10px;font-size:12px;color:${DOMAINS[task.domains[0]].color};cursor:pointer;font-weight:600" onclick="showScience(${index})">📖 查看科学依据 ›</div>
      </div>
    </div>`;
  }).join('');
}

function toggleTask(index){
  const dayData = getDayData(state.currentDate);
  dayData.tasks[index] = !dayData.tasks[index];
  saveData();
  // update totals
  if(dayData.tasks[index]){
    state.data.totalDone = (state.data.totalDone||0)+1;
    // streak
    if(state.currentDate===getToday()){
      const yest = new Date(); yest.setDate(yest.getDate()-1);
      const yestStr = `${yest.getFullYear()}-${String(yest.getMonth()+1).padStart(2,'0')}-${String(yest.getDate()).padStart(2,'0')}`;
      if(state.data.lastActive===yestStr || state.data.lastActive===getToday()){
        if(state.data.lastActive!==getToday()){
          state.data.streak = (state.data.streak||0)+1;
        }
      } else {
        state.data.streak = 1;
      }
      state.data.lastActive = getToday();
    }
  } else {
    state.data.totalDone = Math.max(0,(state.data.totalDone||0)-1);
  }
  saveData();
  renderTimeline();
  if(dayData.tasks[index]) showToast('✅ 完成任务！棒棒哒～');
}

function filterDomain(el, domain){
  state.filterDomain = domain;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderTimeline();
}

function changeDate(delta){
  const d = new Date(state.currentDate);
  d.setDate(d.getDate()+delta);
  state.currentDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  renderTimeline();
}

// ========== 科学依据弹窗 ==========
function showScience(index){
  const task = TASKS[index];
  document.getElementById('smTitle').textContent = '📖 ' + task.title.replace(/^\S+\s/,'');
  document.getElementById('smBody').innerHTML = `<strong>本时段任务：</strong><br>${task.tasks.map(t=>'• '+t).join('<br>')}`;
  document.getElementById('smNote').style.display = 'block';
  document.getElementById('smNoteText').textContent = task.science;
  document.getElementById('scienceModal').classList.add('show');
}
function closeScience(){
  document.getElementById('scienceModal').classList.remove('show');
}

// ========== 统计页渲染 ==========
function renderStats(){
  // week ring
  let weekDone=0, weekTotal=0;
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const done=getDoneCount(ds);
    days.push({date:ds,done,day:d.getDate(),isToday:i===0});
    weekDone+=done;
    weekTotal+=TASKS.length;
  }
  const weekPct = Math.round(weekDone/weekTotal*100);
  const circ = 2*Math.PI*42;
  document.getElementById('weekRing').setAttribute('stroke-dasharray',circ);
  document.getElementById('weekRing').setAttribute('stroke-dashoffset',circ*(1-weekPct/100));
  document.getElementById('weekRingPct').textContent = weekPct+'%';
  let subText = '继续加油！';
  if(weekPct>=80) subText='太棒了！坚持得很好 🌟';
  else if(weekPct>=50) subText='不错哦，继续保持 💪';
  else if(weekPct>0) subText='开始行动吧！';
  document.getElementById('weekSub').textContent = subText;

  // domain stats
  const todayData = getDayData(getToday());
  document.getElementById('domainStats').innerHTML = Object.entries(DOMAINS).map(([key,d])=>{
    const done = TASKS.filter((t,i)=>t.domains.includes(key)&&todayData.tasks[i]).length;
    const total = TASKS.filter(t=>t.domains.includes(key)).length;
    const pct = Math.round(done/total*100);
    return `<div class="ds-card">
      <div class="ds-head">
        <div class="ds-icon" style="background:${d.bg}">${d.icon}</div>
        <div class="ds-name">${d.name}</div>
      </div>
      <div class="ds-bar"><div class="ds-bar-fill" style="width:${pct}%;background:${d.color}"></div></div>
      <div class="ds-num"><strong>${done}</strong>/${total} · ${pct}%</div>
    </div>`;
  }).join('');

  // week bars
  const maxDone = Math.max(...days.map(d=>d.done), 1);
  const colors=['#FF6B6B','#F97316','#FBBF24','#22C55E','#14B8A6','#A855F7','#FF6B9D'];
  document.getElementById('weekBars').innerHTML = days.map((d,i)=>{
    const h = Math.round(d.done/maxDone*100);
    return `<div class="bar-col">
      <div class="bar" style="height:${h}%;background:${d.isToday?'var(--pink)':colors[i]};min-height:${d.done>0?'8px':'4px'}"></div>
      <div class="day-label ${d.isToday?'today':''}">${d.isToday?'今天':d.day}</div>
    </div>`;
  }).join('');

  // badges
  const totalDoneCount = state.data.totalDone||0;
  const streak = state.data.streak||0;
  const allBadges = [
    {icon:'🌱',name:'初次打卡',unlocked:totalDoneCount>=1},
    {icon:'🔥',name:'连续3天',unlocked:streak>=3},
    {icon:'⭐',name:'完成10个',unlocked:totalDoneCount>=10},
    {icon:'🏆',name:'全勤一天',unlocked:days.some(d=>d.done===TASKS.length)},
    {icon:'💪',name:'连续7天',unlocked:streak>=7},
    {icon:'📚',name:'完成50个',unlocked:totalDoneCount>=50},
    {icon:'🌟',name:'运动达人',unlocked:false},
    {icon:'👑',name:'满分宝宝',unlocked:false},
  ];
  document.getElementById('badgesGrid').innerHTML = allBadges.map(b=>
    `<div class="badge ${b.unlocked?'unlocked':'locked'}">
      <div class="b-circle">${b.icon}</div>
      <div class="b-name">${b.name}</div>
    </div>`
  ).join('');
}

// ========== 个人中心渲染 ==========
function renderProfile(){
  document.getElementById('totalDays').textContent = state.data.streak||0;
  document.getElementById('totalDone').textContent = state.data.totalDone||0;
  // avg rate
  const useDays = Math.max(1, Math.ceil((new Date(getToday())-new Date(state.data.firstUse||getToday()))/86400000)+1);
  const avgRate = Math.round((state.data.totalDone||0)/(useDays*TASKS.length)*100);
  document.getElementById('totalRate').textContent = Math.min(100,avgRate)+'%';
}

// ========== 工具函数 ==========
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'),2000);
}

function exportData(){
  const data = JSON.stringify(state.data, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `宝宝成长数据_${getToday()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 数据已导出');
}

function resetData(){
  if(confirm('确定要重置所有数据吗？此操作不可撤销！')){
    localStorage.removeItem('babyTasksData');
    state.data = { dates:{}, streak:0, totalDone:0, firstUse:getToday() };
    saveData();
    renderHome();
    showToast('✅ 数据已重置');
  }
}

// 时钟
function updateClock(){
  const d = new Date();
  document.getElementById('clock').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}
setInterval(updateClock, 60000);
updateClock();

// 初始化
renderHome();
</script>
</body>
</html>
